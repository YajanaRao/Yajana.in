<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="planetGradient" cx="40%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="70%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </radialGradient>
    <filter id="planetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow/atmosphere -->
  <circle cx="60" cy="60" r="38" fill="#4a5568" opacity="0.15" filter="url(#planetGlow)"/>
  
  <!-- Planet body -->
  <circle cx="60" cy="60" r="28" fill="url(#planetGradient)"/>
  
  <!-- Surface details - subtle craters/spots -->
  <circle cx="50" cy="52" r="5" fill="#1a202c" opacity="0.3"/>
  <circle cx="70" cy="65" r="4" fill="#1a202c" opacity="0.25"/>
  <circle cx="55" cy="72" r="3" fill="#1a202c" opacity="0.2"/>
  
  <!-- Highlight -->
  <ellipse cx="48" cy="48" rx="8" ry="6" fill="#718096" opacity="0.3"/>
</svg>