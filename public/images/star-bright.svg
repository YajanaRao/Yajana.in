<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" opacity="0.15" filter="url(#starGlow)"/>
  
  <!-- Core star with 4 points -->
  <polygon 
    points="50,20 54,44 78,50 54,56 50,80 46,56 22,50 46,44" 
    fill="#ffffff" 
    opacity="0.9"
    filter="url(#starGlow)"
  />
  
  <!-- Bright center -->
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
</svg>