<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="twinkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Soft glow -->
  <circle cx="50" cy="50" r="6" fill="#e8f0ff" opacity="0.2" filter="url(#twinkleGlow)"/>
  
  <!-- Simple 4-point star -->
  <polygon 
    points="50,30 52,46 68,50 52,54 50,70 48,54 32,50 48,46" 
    fill="#e8f0ff" 
    opacity="0.85"
    filter="url(#twinkleGlow)"
  />
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="2.5" fill="#ffffff"/>
</svg>